name: Verify methodology and source provenance

on:
  push:
    branches:
      - main
      - feature/methodology-tooltips
      - feature/live-source-refresh
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and SQLite provenance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Node built-in test suite with V8 source coverage
        run: node --experimental-test-coverage --test tests/*.test.mjs

  static:
    name: Typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build

  cloudflare-build:
    name: Standalone Cloudflare Worker build (mock account, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IVR_CLOUDFLARE_D1_ID: '11111111-1111-4111-8111-111111111111'
      IVR_ACCESS_TEAM_DOMAIN: 'https://test-venture.cloudflareaccess.com'
      IVR_ACCESS_AUD: 'test_audience_policy_1234567890'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone Worker and D1 bindings
        run: pnpm exec vite build --config vite.cloudflare.config.ts
      - name: Check standalone build without any Cloudflare credentials
        run: node scripts/cloudflare-build-check.mjs
      - name: Apply actual versioned migrations to disposable local D1
        run: pnpm exec wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Generate reviewed SQL and apply idempotent local seed twice
        run: |
          pnpm seed
          pnpm exec wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file data/seed.sql
          pnpm exec wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file data/seed.sql
      - name: Verify real D1 query and all reviewed source counts
        run: node scripts/cloudflare-local-db-check.mjs
