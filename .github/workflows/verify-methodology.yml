name: Verify methodology and source provenance

on:
  push:
    branches:
      - main
      - feature/methodology-tooltips
      - feature/live-source-refresh
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and SQLite provenance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node built-in test suite
        run: node --test tests/*.test.mjs

  static:
    name: Typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
