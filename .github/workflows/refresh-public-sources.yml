name: Refresh Illinois public research sources

on:
  schedule:
    # Daily official news; the runner adds directory, OTM and identity-gated APIs each Monday.
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      connector:
        description: 'Which approved source to refresh'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - research-park-1
          - research-park-2
          - research-park-3
          - research-park-news
          - illinois-news
          - otm-startups
          - nih-reporter
          - usaspending
          - github-releases

permissions:
  contents: read

concurrency:
  group: ivr-public-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh official source adapters
    if: ${{ vars.IVR_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Call deployed, authenticated refresh endpoint
        env:
          IVR_AUTOMATION_ENABLED: ${{ vars.IVR_AUTOMATION_ENABLED }}
          IVR_SITE_URL: ${{ vars.IVR_SITE_URL }}
          IVR_ADMIN_TOKEN: ${{ secrets.IVR_ADMIN_TOKEN }}
          IVR_SITES_SERVICE_TOKEN: ${{ secrets.IVR_SITES_SERVICE_TOKEN }}
          IVR_CONNECTOR: ${{ inputs.connector || 'scheduled' }}
        run: node scripts/refresh-site.mjs
