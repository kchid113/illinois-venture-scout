name: Diagnose public iVenture listing markup (temporary)
on:
  push:
    branches:
      - feature/full-uiuc-source-coverage
    paths:
      - .github/workflows/diagnose-iventure.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public cohort markup without writing raw HTML
        run: |
          node --input-type=module <<'NODE'
          import {officialHTML} from './core/source-adapters.mjs';
          import {text} from './core/ingestion.mjs';
          const {html}=await officialHTML('iventure-cohorts');
          console.log('HTML chars',html.length);
          console.log('headings', [...html.matchAll(/<h([2-6])\b[^>]*>([\s\S]*?)<\/h\1>/gi)].slice(0,30).map(m=>m[1]+':'+text(m[2])));
          console.log('strong tags', [...html.matchAll(/<(?:strong|b)\b[^>]*>([\s\S]*?)<\/(?:strong|b)>/gi)].slice(0,40).map(m=>text(m[1])));
          for(const word of ['iVenture 11','CreatoRain','Credence Cleantech','iVenture 10']){
            const i=html.indexOf(word);
            console.log('MARKUP AROUND',word,'OFFSET',i,'SNIPPET',i>=0?html.slice(Math.max(0,i-180),i+850):'not found');
          }
          NODE
