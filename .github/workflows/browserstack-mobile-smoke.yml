name: BrowserStack student mobile smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ivr-browserstack-mobile
  cancel-in-progress: false

jobs:
  smoke:
    name: Real-device public entry and sign-in smoke
    if: ${{ github.ref == 'refs/heads/main' && vars.IVR_BROWSERSTACK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public entry on BrowserStack mobile
        env:
          IVR_BROWSERSTACK_ENABLED: 'true'
          IVR_BROWSERSTACK_USERNAME: ${{ secrets.IVR_BROWSERSTACK_USERNAME }}
          IVR_BROWSERSTACK_ACCESS_KEY: ${{ secrets.IVR_BROWSERSTACK_ACCESS_KEY }}
          IVR_BROWSERSTACK_SITE_URL: ${{ vars.IVR_BROWSERSTACK_SITE_URL }}
          IVR_BROWSERSTACK_DEVICE: ${{ vars.IVR_BROWSERSTACK_DEVICE }}
          IVR_BROWSERSTACK_OS_VERSION: ${{ vars.IVR_BROWSERSTACK_OS_VERSION }}
        run: node scripts/browserstack-smoke.mjs
