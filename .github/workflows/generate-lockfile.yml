name: Generate npm lockfile once (migration branch only)
on:
  push:
    branches: [feature/vercel-supabase-native-migration]
permissions:
  contents: write
jobs:
  lock:
    if: "!startsWith(github.event.head_commit.message, 'chore(lock):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(lock): pin Vercel and Supabase dependency graph"
          git push origin HEAD:feature/vercel-supabase-native-migration
