name: Deploy Illinois Venture Radar to Cloudflare (manual)

on:
  workflow_dispatch:
    inputs:
      create_d1:
        description: 'Authorize creation of a NEW dedicated D1 database if none exists'
        required: true
        default: false
        type: boolean
      import_source_catalog:
        description: 'Import prepared source catalog into D1 (new directory companies + pending review leads)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ivr-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate and deploy protected Worker
    # Never grant production credentials to PR, Dependabot or feature branches.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      IVR_ACCESS_TEAM_DOMAIN: ${{ vars.IVR_ACCESS_TEAM_DOMAIN }}
      IVR_ACCESS_AUD: ${{ vars.IVR_ACCESS_AUD }}
      IVR_ADMIN_EMAIL: ${{ vars.IVR_ADMIN_EMAIL }}
      IVR_ALLOW_CREATE_D1: ${{ inputs.create_d1 && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Validate deployment configuration before any remote changes
        run: |
          node scripts/cloudflare-deploy-preflight.mjs
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full regression suite
        run: node --experimental-test-coverage --test tests/*.test.mjs
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint
      - name: Select or explicitly create isolated D1 database
        id: database
        run: node scripts/cloudflare-provision.mjs
      - name: Build standalone Cloudflare Worker
        run: pnpm exec vite build --config vite.cloudflare.config.ts
      - name: Verify exact Worker artifact, Access vars and D1 binding
        run: node scripts/cloudflare-build-check.mjs
      - name: Apply versioned D1 migrations with Wrangler rollback protection
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$IVR_WORKER_CONFIG"
      - name: Import reviewed public companies on a new database only
        if: ${{ steps.database.outputs.created == 'true' }}
        run: |
          pnpm seed
          pnpm exec wrangler d1 execute DB --remote --config "$IVR_WORKER_CONFIG" --file data/seed.sql
      - name: Deploy independently authenticated Worker
        run: pnpm exec wrangler deploy --config "$IVR_WORKER_CONFIG"
      - name: Validate source catalog and prepare D1-safe transactional import
        if: ${{ inputs.import_source_catalog }}
        run: |
          node scripts/validate-live-snapshot.mjs
          node scripts/prepare-d1-catalog-import.mjs
      - name: Record existing D1 Time Travel bookmark before source import
        if: ${{ inputs.import_source_catalog && steps.database.outputs.created != 'true' }}
        run: pnpm exec wrangler d1 time-travel info DB --config "$IVR_WORKER_CONFIG"
      - name: Import source-backed startup companies and pending review candidates
        if: ${{ inputs.import_source_catalog }}
        run: pnpm exec wrangler d1 execute DB --remote --config "$IVR_WORKER_CONFIG" --file .catalog-import-d1.sql
      - name: Display non-sensitive post-import D1 counts
        if: ${{ inputs.import_source_catalog }}
        run: pnpm exec wrangler d1 execute DB --remote --config "$IVR_WORKER_CONFIG" --command "SELECT (SELECT COUNT(*) FROM companies) AS public_companies, (SELECT COUNT(*) FROM source_candidates WHERE status='Pending') AS pending_source_candidates"
      - name: Next action
        run: |
          echo "Worker code deployed. Confirm Cloudflare Zero Trust Access protects the Worker and its workers.dev hostname."
          echo "Cloudflare Access team-domain and audience must match the policy attached to the Worker."
          echo "Existing ChatGPT Sites D1 user data has not been copied."
