version: 2
updates:
  # pnpm uses the npm ecosystem; no student token or manual integration required.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 4
    groups:
      application-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
